[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grk"
version = "0.1.0"
description = "CLI tool for Grok LLM"
authors = [{name = "Your Name"}]
dependencies = [
    "xai-sdk",
    "pydantic",
    "rich",
    "ruamel.yaml",
    "treeparse",
]

[project.scripts]
grk = "grk.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
