[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grk"
version = "0.2.3"
description = "CLI tool for Grok LLM"
authors = [{ name = "wr1", email = "8971152+wr1@users.noreply.github.com"}]
readme = "README.md"
dependencies = [
    "xai-sdk",
    "pydantic",
    "rich",
    "ruamel.yaml",
    "treeparse",
]

[project.scripts]
grk = "grk.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
